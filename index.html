<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Развивающие сказки — Интерактивные развивающие истории</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff8c5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сказки">
  <link rel="apple-touch-icon" href="assets/images/common/cat-walk.png">

  <!-- Open Graph (превью при расшаривании) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maxolio.github.io/kids-story-quest_1/">
  <meta property="og:title" content="Развивающие сказки">
  <meta property="og:description" content="Интерактивные развивающие истории для малышей — помоги котёнку в его приключениях!">
  <meta property="og:image" content="https://maxolio.github.io/kids-story-quest_1/assets/images/common/cat-walk.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="ru_RU">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Развивающие сказки">
  <meta name="twitter:description" content="Интерактивные развивающие истории для малышей">
  <meta name="twitter:image" content="https://maxolio.github.io/kids-story-quest_1/assets/images/common/cat-walk.png">

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Основной контейнер приложения (SPA) -->
  <div id="app-container">
    <!-- Контент динамически генерируется js/app.js -->
  </div>

  <!-- Главный скрипт с поддержкой ES-модулей -->
  <script type="module" src="js/app.js"></script>

  <!-- Регистрация Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(r => console.log('SW зарегистрирован:', r.scope))
          .catch(e => console.warn('SW ошибка:', e));
      });
    }
  </script>
</body>
</html>
